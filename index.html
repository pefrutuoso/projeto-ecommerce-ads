<!DOCTYPE html>
<html lang="pt-BR" class="tema-claro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TechStore - E-commerce acadêmico com produtos carregados pela Fake Store API.">
    <title>TechStore - A sua loja de eletrônicos</title>

    <link rel="stylesheet" href="./style/style.css">
    <script src="./scripts/script.js" defer></script>
</head>

<body>

    <!-- Cabeçalho -->
    <header class="cabecalho">
        <div class="container cabecalho-conteudo">
            <h1 class="cabecalho-titulo">TechStore</h1>

            <nav aria-label="Navegação principal">
                <ul class="menu">
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#produtos">Produtos</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>

            <div class="busca-container">
                <input
                    type="search"
                    id="campo-busca"
                    class="campo-busca"
                    placeholder="Buscar produtos..."
                    aria-label="Buscar produtos"
                >
            </div>

            <div class="acoes-header">
                <button id="btn-tema" class="botao-tema" type="button">
                    🌙 Modo Escuro
                </button>

                <button id="btn-carrinho" class="botao-carrinho" type="button">
                    🛒 Carrinho:
                    <span id="contador-carrinho" class="contador-carrinho">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Notificação visual -->
    <div id="notificacao" class="notificacao" role="status" aria-live="polite"></div>

    <!-- Conteúdo principal -->
    <main id="inicio">
        <section id="produtos" class="container secao-produtos">
            <h2 class="titulo-secao">Nossos Produtos em Destaque</h2>

            <p id="mensagem-status" class="mensagem-status" role="status">
                Carregando produtos...
            </p>

            <div id="grid-produtos" class="grid-produtos">
                <!-- Os produtos serão carregados pela Fake Store API -->
            </div>
        </section>
    </main>

    <!-- Carrinho lateral -->
    <aside id="carrinho" class="carrinho" aria-label="Carrinho de compras" aria-hidden="true">
        <div class="carrinho-cabecalho">
            <h2>Seu carrinho</h2>

            <button id="btn-fechar-carrinho" class="botao-fechar" type="button" aria-label="Fechar carrinho">
                ✕
            </button>
        </div>

        <ul id="lista-carrinho" class="lista-carrinho"></ul>

        <p id="carrinho-vazio" class="carrinho-vazio">
            Seu carrinho está vazio.
        </p>

        <div class="carrinho-total">
            <strong>Total:</strong>
            <span id="valor-total">R$ 0,00</span>
        </div>

        <button id="btn-finalizar" class="botao-finalizar" type="button">
            Finalizar compra
        </button>
    </aside>

    <!-- Rodapé -->
    <footer id="contato" class="rodape">
        <div class="container">
            <p>&copy; 2026 TechStore. Todos os direitos reservados.</p>
            <p>Atendimento: contato@techstore.com.br</p>
        </div>
    </footer>

</body>
</html>
